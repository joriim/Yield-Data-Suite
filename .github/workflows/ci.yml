name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,geo,fusion,mcp]"
      - run: pytest --cov=yieldsuite --cov-report=term-missing

  qgis:
    # The QGIS plugin's Processing algorithms in a headless QGIS 3.34 (Ubuntu 24.04),
    # with pandas 3 / numpy 2 as QGIS users get them from pip.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-qgis qgis-providers python3-pyqt5.sip python3-venv
      - run: /usr/bin/python3 -m venv --system-site-packages .qvenv
      - run: .qvenv/bin/pip install -e ".[dev,geo,fusion]" "scipy>=1.14"
      - run: QT_QPA_PLATFORM=offscreen .qvenv/bin/python -m pytest -q tests/qgis tests/test_chain.py tests/test_quality.py tests/test_ingest_formats.py
      - name: Plugin zip
        run: cd qgis_plugin && cp LICENSE yieldsuite_qgis/ && zip -r ../yieldsuite_qgis.zip yieldsuite_qgis
      - uses: actions/upload-artifact@v4
        with:
          name: yieldsuite_qgis
          path: yieldsuite_qgis.zip

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - run: mkdocs build
